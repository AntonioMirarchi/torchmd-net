# Run from the repository root:
# python -m torchmdnet.scripts.train --conf examples/amaro_examples/input.yaml
# The JSON selects one mdCATH Parquet file at each of 300 K, 320 K and 348 K.
dataset: HFDataset
dataset_root: .cache/amaro-hf-smoke
dataset_arg:
  paths: examples/amaro_examples/three_sources.json
  properties: []  # Read only atomic_numbers, positions and forces.
  stride: 1  # Each JSON record overrides this value.
  max_num_atoms: 4096  # Counted before hydrogen removal.
  max_gradient: 500.0  # kcal/mol/angstrom, after force_scale.
  mask_hydrogen: true
  hf_workers: 1
  use_box: false

model: tensornet
embedding_dimension: 32
num_rbf: 8
num_layers: 1
rbf_type: expnorm
activation: silu
equivariance_invariance_group: O(3)
cutoff_lower: 0.0
cutoff_upper: 4.5
cutoff_fn_type: polynomial  # Quintic envelope with zero first/second derivatives at its endpoints.
max_num_neighbors: 128
max_z: 100
output_model: Scalar
reduce_op: add
prior_model: null
derivative: true
y_weight: 0.0
neg_dy_weight: 1.0
force_loss_reduction: graph_mean  # Equal weight per structure, independent of atom count.
charge: false
spin: false
standardize: false
static_shapes: false

batch_size: 1
inference_batch_size: 1
num_workers: 0
num_epochs: 1
ngpus: 1  # One device; Lightning selects CPU when CUDA is unavailable.
precision: 32
lr: 0.0001
lr_warmup_steps: 0
gradient_clipping: 10.0
seed: 42
train_size: 0.8
val_size: 0.1
test_size: 0.1
splits: null
save_interval: 1
test_interval: -1
log_dir: logs/amaro-hf-smoke
wandb_use: false
tensorboard_use: false
